global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

api:
  dashboard: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: duckdns
        domains:
          - main: "jaganin.duckdns.org"
            sans:
              - "*.jaganin.duckdns.org"

providers:
  # File provider — authoritative for native/non-Docker services (jeedom, qbittorrent,
  # alfred, synology...) and for any Docker service not yet migrated to labels.
  file:
    directory: /etc/traefik/dynamic
    watch: true

  # Docker provider — opt-in via labels only (exposedByDefault: false), so it never
  # picks up a container unless explicitly labeled. Previously disabled (commit 628acda)
  # after "client version 1.24 is too old" errors against Docker Engine 29 — that was a
  # bug in Traefik's vendored Docker SDK before v3.6, fixed upstream with proper API
  # negotiation, not something a DOCKER_API_VERSION pin could work around. Confirmed
  # fixed on traefik:v3.6 against this host's Docker Engine 29.1.3 (API 1.52).
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
    watch: true

certificatesResolvers:
  duckdns:
    acme:
      email: clement.cunin@gmail.com
      storage: /etc/traefik/certs/acme.json
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: duckdns
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
        propagation:
          delayBeforeChecks: 60s
          disableANSChecks: true
